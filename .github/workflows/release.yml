name: Release BlendUp

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - windows-latest
          - ubuntu-22.04
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Installer Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Installer les dépendances Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Installer les dépendances du projet
        run: npm ci

      - name: Vérifier le projet
        run: npm test

      - name: Construire et joindre les installateurs
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: npm run tauri
          tagName: ${{ github.ref_name }}
          releaseName: BlendUp ${{ github.ref_name }}
          releaseBody: Télécharge l'installateur correspondant à ton système. L'add-on Blender se trouve dans les fichiers de la release.
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true

      - name: Joindre l'add-on Blender
        if: matrix.platform == 'windows-latest'
        run: gh release upload "${{ github.ref_name }}" "apps/blender-addon/blendup.zip" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
